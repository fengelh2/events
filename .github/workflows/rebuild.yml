name: Rebuild all cities

on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'cities/**'
      - '.github/workflows/**'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - id: pw-version
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium
      - run: python -m playwright install --with-deps chromium

      # Scoped rebuild: only re-scrape cities whose YAML changed (or whose
      # shared tools changed). For ALL cities not in scope, we re-use the
      # last deployed dist/<code>/index.html so they don't disappear from
      # the published site.
      - name: Determine scope of rebuild
        id: scope
        run: |
          ALL_CITIES="hk hk-kids la nrw singa fukuoka"
          ONLY=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scheduled/manual → full rebuild"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            if echo "$CHANGED" | grep -qE "^tools/(scrape_venue_events|render_events_html|rebuild_calendar|build_all|parse_ical|check_links|investigate_broken_links|apply_link_patch)\.py$"; then
              echo "shared tools changed → full rebuild"
            elif echo "$CHANGED" | grep -qE "^\.github/workflows/"; then
              echo "workflow changed → full rebuild"
            elif echo "$CHANGED" | grep -qE "^cities/[^/]+/(config|site\.yaml|data)"; then
              CITIES=$(echo "$CHANGED" | grep -oE "^cities/[^/]+" | sort -u | sed 's|cities/||' | tr '\n' ' ')
              echo "city configs changed: $CITIES"
              ONLY="--only $CITIES"
            else
              echo "no scope-affecting change → full rebuild (defensive)"
            fi
          fi
          echo "only=$ONLY" >> $GITHUB_OUTPUT

      # Restore the live dist/ from the gh-pages branch so cities NOT in
      # scope keep their existing rendered HTML.
      - name: Fetch previous dist from gh-pages
        if: steps.scope.outputs.only != ''
        run: |
          mkdir -p dist
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/prev-dist origin/gh-pages
            cp -r /tmp/prev-dist/* dist/ 2>/dev/null || true
            git worktree remove /tmp/prev-dist 2>/dev/null || true
            echo "Restored $(ls dist/ | wc -l) entries from previous deploy"
          fi

      - name: Rebuild cities
        run: python tools/build_all.py --verbose ${{ steps.scope.outputs.only }}
      - name: Audit event links (non-fatal)
        run: python tools/check_links.py
        continue-on-error: true
      - name: Investigate broken links + auto-patch URL replacements
        run: |
          python tools/investigate_broken_links.py || true
          python tools/apply_link_patch.py || true   # replacements only; removals still informational
        continue-on-error: true
      - name: Commit seen-events state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet cities/*/data/seen_events.json cities/*/data/events_cache.json cities/*/config/venues.yaml; then
            git add cities/*/data/seen_events.json cities/*/data/events_cache.json cities/*/config/venues.yaml
            git commit -m "auto: seen_events + scrape cache + auto-patched broken URLs"
            for i in 1 2 3; do
              if git push origin main; then break; fi
              git pull --rebase -X ours origin main || true
              sleep 2
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

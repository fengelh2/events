- id: xiqu-centre
  name: Xiqu Centre (West Kowloon Cultural District)
  city: Kowloon
  category: mixed              # primarily xiqu/Cantonese opera but also hosts musicals (CATS), cabaret, theatre
  category_keyword_overrides:
    theatre:
      - musical
      - musicalcon
      - cabaret
      - cats
    opera:
      - xiqu
      - cantonese opera
  homepage: https://www.westk.hk
  calendar_url: https://www.westk.hk/en/venue/xiqu-centre
  kind: playwright_detail_pages
  source_priority: 0
  locale: en-US
  detail_via_playwright: true
  use_stealth: true               # bypass Cloudflare Turnstile on detail pages
  detail_extra_wait_ms: 15000     # Cloudflare auto-resolve takes ~10-15s
  max_details: 30
  # Listing page (/en/venue/xiqu-centre) hits a Cloudflare-Turnstile
  # CAPTCHA that even playwright-stealth doesn't auto-solve. Detail
  # pages (/en/event/<slug>) pass the lighter "managed" challenge with
  # stealth + realistic UA. So we hand-seed event URLs (found via
  # DuckDuckGo `site:westk.hk /en/event/` searches) and let the parser
  # fetch each detail page with stealth-Playwright.
  detail_urls:
    - https://www.westk.hk/en/event/trump-twins-president-5   # Cantonese opera
    - https://www.westk.hk/en/event/cats-musical              # CATS musical, Aug 2026
    - https://www.westk.hk/en/event/cabaret-festival
    - https://www.westk.hk/en/event/hong-kong-musicalcon-2026
    - https://www.westk.hk/en/event/spring-presents
    - https://www.westk.hk/en/event/likes-lies
    - https://www.westk.hk/en/event/2026-coffee-hong-kong
    - https://www.westk.hk/en/event/funfest
  selectors:
    title: "h1"
    date: "body"
  date_extract_regex: '\d{1,2}[/\.-]\d{1,2}[/\.-]\d{4}|\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  notes: |
    Cantonese opera + xiqu programmes at West Kowloon Cultural District.

    *** FRAGILE / EXPERIMENTAL — bypass works only on first request ***

    westk.hk uses Cloudflare Turnstile. With playwright-stealth +
    --disable-blink-features=AutomationControlled, the FIRST request
    from a fresh IP loads the full event detail page. From the 2nd
    request onward, Cloudflare flags the IP and returns the
    "Performing security verification" interstitial that even stealth
    can't auto-resolve.

    Configured here with 8 hand-seeded event URLs (found via
    DuckDuckGo `site:westk.hk /en/event/` searches; rotate as new
    events appear). The GitHub Actions runner has a different IP than
    my local box, so CI may catch 1-2 events per rebuild before
    being flagged.

    For reliable Xiqu coverage, build a Timable HK parser (Timable
    aggregates westk.hk events without going through Cloudflare).


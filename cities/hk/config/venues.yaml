# Hong Kong cultural-events venues.
#
# Geographic zones (3): "Hong Kong Island" / "Kowloon" / "New Territories".
# Each venue gets the city field set to its primary location. Multi-venue
# aggregators (LCSD when onboarded) will need per-event zone mapping.
#
# Onboarding philosophy: aggregators first (LCSD covers 7+ government venues
# at once), then high-volume single-venue sources, then museums.
# `kind: unknown` means a venue is on the radar but not yet wired to a
# scraper — the rebuild orchestrator skips them with a count warning.
#
# Bilingual sites: always use the /en/ endpoint. Chinese-only sites
# (Sunbeam Theatre, some xiqu troupes) are accepted as-is — do NOT
# translate; the user reads Chinese.

# ============================================================================
# CLASSICAL / ORCHESTRAL
# ============================================================================

- id: hk-phil
  name: Hong Kong Philharmonic Orchestra
  city: Kowloon                  # primary venue is HK Cultural Centre, TST
  category: concert
  homepage: https://www.hkphil.org
  calendar_url: https://www.hkphil.org/concert
  kind: html_list
  source_priority: 0
  selectors:
    item: ".new-hl-event__wrapper"
    title: ".new-hl-event__title"
    date: ".new-hl-event__date"
    detail_link: "a@href"
  # Multi-night runs concatenate dates in one cell ("12 JUN 2026 (Fri) 7:30pm
  # 13 JUN 2026 (Sat) 5:00pm"). Take the first date+time; render-side
  # recurrence collapse shows the rest under the same card.
  date_extract_regex: '\d{1,2}\s+(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{4}\s*\([^)]+\)\s*\d{1,2}:\d{2}(?:am|pm)'
  # HK Phil sometimes performs ballet music in concert form (orchestra only,
  # no dancers). Without override, the global ballet keywords (Nutcracker,
  # Sleeping Beauty, Swan Lake, etc.) push these into the ballet bucket.
  # First override: if the title mentions an HK Ballet collaboration,
  # KEEP as ballet. Second: otherwise, any concert-form-only ballet-music
  # title goes to concert. (Python+yaml preserves dict insertion order.)
  category_keyword_overrides:
    ballet:
      - hong kong ballet
      - hkb on world tour
    concert:
      - nutcracker
      - sleeping beauty
      - swan lake
      - giselle
      - romeo and juliet
      - carmen
  notes: |
    Server-rendered concert list. Page contains both upcoming + past;
    render-side future-only filter drops past events automatically.
    Date format: "18 MAY 2026 (Mon) 7:30pm" — DMY with month name.

- id: hk-chinese-orchestra
  name: Hong Kong Chinese Orchestra
  city: Kowloon
  category: concert
  homepage: https://www.hkco.org
  calendar_url: https://www.hkco.org/en/Concerts/Events.html
  kind: playwright_html_list
  source_priority: 0
  locale: en-US
  wait_for_selector: ".list-item-row .item-title"
  extra_wait_ms: 3000
  selectors:
    item: ".list-item-row"
    title: ".item-title"
    date: ".item-venue"
    detail_link: "a@href"
  # ".item-venue" returns "2 May 2026 (Wed) 3:00PM / 8:00PM\nVenue name..."
  # Extract just the date+time portion.
  date_extract_regex: '\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  notes: |
    Direct fetches of /en/Concerts-Activities/Upcoming-Concerts.html
    redirect to /en/index.html (SPA routing). The actual concert
    schedule lives at /en/Concerts/Events.html — server-rendered list
    of .list-item-row entries. Each row has item-title + item-venue
    with date prefix + Chinese hall name appended.

- id: hk-sinfonietta
  name: Hong Kong Sinfonietta
  city: Hong Kong Island
  category: concert
  homepage: https://hksl.org
  calendar_url: https://hksl.org/
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: 'https://hksl\.org/concert/[a-z0-9%-]+/'
  selectors:
    title: "h1"
    date: "body"
  date_extract_regex: '\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}'
  accept_drop_rate: 0.3
  notes: |
    Orchestra moved domain: hksinfonietta.org → hksl.org. The homepage
    lists ~40 /concert/<slug>/ URLs. Each detail page exposes h1 +
    "DD Month YYYY" date in prose. detail_pages parser walks them.

# ============================================================================
# OPERA / BALLET / DANCE
# ============================================================================

- id: hk-ballet
  name: Hong Kong Ballet
  city: Kowloon                  # primary stages at HK Cultural Centre
  category: ballet
  homepage: https://www.hkballet.com
  calendar_url: https://www.hkballet.com/en/see-hkb
  kind: playwright_html_list
  source_priority: 0
  locale: en-US
  wait_for_selector: "a[href*='/production/'] h1"
  extra_wait_ms: 2500
  selectors:
    item: "a[href*='/production/']"
    title: "h1 em"                     # h1 has <small>presenter</small><em>Title</em>
    date: "label"
    detail_link: "@href"
  # Date formats: "30 APR – 31 MAY 2026" or "JUL 2025 - 2026" (month-only).
  date_extract_regex: '\d{1,2}\s+(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}|(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s+\d{4}'
  accept_drop_rate: 0.5
  notes: |
    /en/see-hkb listing. Each production anchor wraps an h1 with two
    children: <small>presenter</small> + <em>title</em>. The em selector
    gives just the production name; the label gives the date range.
    Productions occasionally lack an <em> (announcement card without
    title) — accept_drop_rate covers that.

- id: opera-hk
  name: Opera Hong Kong
  city: Kowloon                  # primary stages at HK Cultural Centre
  category: opera
  homepage: https://operahongkong.org
  # Use the WordPress sitemap as the listing source — pattern below
  # filters to per-production pages whose slug carries a year suffix
  # (e.g. /carmen2026/). Productions without a year suffix in the
  # slug are archive pages we don't want.
  calendar_url: https://operahongkong.org/wp-sitemap-posts-page-1.xml
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: 'https://operahongkong\.org/[a-z][a-z0-9-]*20(?:2[5-9]|3\d)/'
  selectors:
    title: "h1"
    date: "body"               # scoped via date_extract_regex below
  date_extract_regex: '\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December),?\s+\d{4}'
  notes: |
    Earlier probe missed this: /upcoming-productions/ is an empty
    landing shell (Playwright body = 491 chars), but per-production
    pages DO exist as standalone WordPress posts. Sitemap exposes
    them at the same listing index that hides the live calendar.
    Filter to year-suffix slugs (carmen2026, aida2025, etc.) since
    title-only slugs (/aida/, /tosca/) are old archive pages.
    Date is buried in a prose paragraph ("from 7 to 10 May 2026") —
    regex picks the first DD-Month-YYYY token.


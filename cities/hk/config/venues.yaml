- id: hk-palace-museum
  name: Hong Kong Palace Museum
  city: Kowloon                  # West Kowloon Cultural District
  category: museum_exhibition
  homepage: https://www.hkpm.org.hk
  calendar_url: https://www.hkpm.org.hk/en/exhibition
  kind: playwright_detail_pages
  source_priority: 0
  locale: en-US
  wait_for_selector: "a[href*='/exhibition/']"
  extra_wait_ms: 4000
  detail_via_playwright: true     # detail pages are also JS-rendered
  detail_extra_wait_ms: 3000
  max_details: 12
  detail_url_filter: "/en/exhibition/[a-z0-9-]+"  # filter out hub/list paths
  selectors:
    item: "a[href*='/exhibition/']"
    title: "h2"                     # h1 carries "Hong Kong Palace Museum | …" prefix; h2 is the real title
    date: "[class*=accordion]"      # rotation periods or single exhibition period
  # First date in the accordion text ("20 March, 2026 – 15 June 2026")
  date_extract_regex: '\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December),?\s+\d{4}\s*[–—-]\s*\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December),?\s+\d{4}'
  notes: |
    JS-rendered both at list and detail. New playwright_detail_pages
    parser shares one Playwright session across the listing render
    (to harvest /en/exhibition/<slug> URLs) and each detail render
    (to extract h2 title + accordion-header date range). Exhibitions
    with multi-rotation periods give the first range as start/end.


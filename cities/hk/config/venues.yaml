- id: hk-palace-museum-events
  name: Hong Kong Palace Museum (Events Programme)
  display_name: HK Palace Museum (Events)
  city: Kowloon                  # West Kowloon Cultural District
  category: other
  homepage: https://www.hkpm.org.hk
  calendar_url: https://www.hkpm.org.hk/en/event
  kind: playwright_html_list
  source_priority: 0
  locale: en-US
  wait_for_selector: "a[href*='/en/event/']"
  extra_wait_ms: 4000
  selectors:
    item: ".hkpm_discover_slide_text"
    title: "h3"
    date: "p.grey"                  # "Talk<br>05.06.2026"
    detail_link: "a[href*='/en/event/']@href"
  date_extract_regex: '\d{1,2}\.\d{1,2}\.\d{4}\s*[-–—]\s*\d{1,2}\.\d{1,2}\.\d{4}|\d{1,2}\.\d{1,2}\.\d{4}'
  date_format: "%d.%m.%Y"
  notes: |
    Separate from hk-palace-museum (which scrapes /en/exhibition).
    /en/event lists 16+ talks/workshops/symposiums/film-screenings
    in .hkpm_discover_slide_text cards. h3 = title, p.grey = "<type>
    <br><date>" (date DD.MM.YYYY). date_format avoids DMY parsing the
    leading "05" of "05.06.2026" as day-5 confused with year.


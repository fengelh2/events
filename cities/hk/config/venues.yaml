# Kadoorie Farm & Botanic Garden — 48 events visible in static HTML.
# Detail-pages parser walks /en/events/<slug> URLs.
- id: kfbg
  name: Kadoorie Farm and Botanic Garden
  display_name: Kadoorie Farm
  city: New Territories            # Tai Po, Lam Kam Road
  category: other
  homepage: https://www.kfbg.org
  calendar_url: https://www.kfbg.org/en/event-calendar
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: '/en/events/[a-z0-9-]+'
  selectors:
    title: "title"                 # detail pages have no h1/h2 for event title; <title> carries it
    date: "body"
  title_strip_suffixes:
    - "::Kadoorie Farm and Botanic Garden"
  # Detail page prose: "Date: 30 May 2026 (Sat)" or ranges like
  # "23 Mar - 31 May 2026". Pull either form; the parser uses the
  # first hit. Single-month ranges ("21, 23, 25 Jul 2026") parse to
  # the first DD.
  date_extract_regex: '\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  accept_drop_rate: 0.55           # ~half are group-application / open-ended ("Mon-Sat") with no specific dates
  notes: |
    Verified 2026-05-24: 48 detail URLs in static HTML at /en/event-calendar.
    Each detail page exposes h1 title + prose paragraph with
    "Date: DD MMM YYYY (Dow)" pattern. Major nature + family
    programmes: summer camps for children, parent-child puppet
    theatre, World Otter Day, Plant/Animal/Night Walk Encounters.
    Many open-ended group-application programmes have no specific
    date — accept_drop_rate=0.55 covers these.


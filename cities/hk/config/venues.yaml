- id: hk-rep
  name: Hong Kong Repertory Theatre
  city: Hong Kong Island          # Sheung Wan HQ; performs widely
  category: theatre
  homepage: https://www.hkrep.com
  calendar_url: https://www.hkrep.com/en/Season-Programme/Main-Stage-Productions.html
  kind: playwright_html_list
  source_priority: 0
  locale: en-US
  wait_for_selector: "a[href*='/Main-Stage-Productions/'] h3.lineh3"
  extra_wait_ms: 2500
  selectors:
    item: "a[href*='/Main-Stage-Productions/']"
    title: "h3.lineh3"
    date: "ul.pro-detail"          # contains venue + "22.05.2026 - 07.06.2026"
    detail_link: "@href"
  date_extract_regex: '\d{1,2}\.\d{1,2}\.\d{4}\s*-\s*\d{1,2}\.\d{1,2}\.\d{4}'
  date_find_all: true              # range — pull both endpoints
  notes: |
    Static HTML returns empty content; site is JS-rendered. Once
    Playwright loads, each production is a top-level <a> with h3
    title + ul.pro-detail listing venue + date range (DMY).
    The Programme-Archive anchor matches the same selector but lacks
    h3.lineh3 — it's silently dropped by the assembler's no-title path.

- id: chung-ying
  name: Chung Ying Theatre Company
  city: Hong Kong Island
  category: theatre
  homepage: https://www.chungying.com
  calendar_url: https://www.chungying.com/en/production-list/
  kind: html_list
  source_priority: 0
  selectors:
    item: ".program-item"
    title: ".font-black"             # "47th Season: Whispering Glimmers"
    date: ".date-grid-container"     # raw date text within program-item
    detail_link: "a@href"
  date_extract_regex: '\d{1,2}[\s/.-]+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\s/.-]+\d{2,4}|\d{1,2}/\d{1,2}/\d{2,4}|\d{4}[/.-]\d{1,2}[/.-]\d{1,2}'
  accept_drop_rate: 0.65           # many programs are season banners / TBA / past
  notes: |
    Tailwind-styled site, ~20 productions. Date container has icon SVG
    + text — regex extracts the first plausible date. May need tuning;
    monitor DROP warning after first rebuild.


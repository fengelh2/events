# FESTIVALS (seasonal — guard with date range, expect 0 events off-season)
# ============================================================================

- id: hk-arts-festival
  name: Hong Kong Arts Festival
  city: Kowloon                  # primary venue HK Cultural Centre; performs across zones
  category: mixed
  homepage: https://www.hk.artsfestival.org
  calendar_url: https://www.hk.artsfestival.org/en/programme
  kind: html_list
  source_priority: 0
  selectors:
    item: ".styled__ProgrammeCardContainer-sc-uiqggj-1"
    title: ".styled__Title2Typography-sc-uiqggj-6"
    date: ".styled__VenueTypeItem-sc-uiqggj-9"
    detail_link: ".styled__LinkA-sc-uiqggj-12@href"
  # Date format on cards is "2026.03.30" (YYYY.MM.DD). dateparser handles
  # the YYYY-first form regardless of DATE_ORDER setting. Sometimes
  # multiple dates concatenate — extract just the first.
  date_extract_regex: '\d{4}\.\d{1,2}\.\d{1,2}'
  accept_drop_rate: 0.7            # many cards display venue+genre only, no date until ticketing opens
  notes: |
    Annual Feb–Mar festival. 100+ events during season, ~0 off-season.
    Server-rendered MUI (Material-UI) cards; selectors use emotion CSS
    hashes — re-probe selectors annually as the bundle may rename them.


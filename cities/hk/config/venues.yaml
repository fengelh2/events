# ----- Time Out HK — monthly editorial roundup with <time> microdata -----
- id: hkfc-rugby-fixtures
  name: HKFC Rugby (men + women + youth fixtures)
  display_name: HKFC Rugby
  city: Hong Kong Island
  category: sport
  homepage: https://hkfcrugby.com
  calendar_url: https://hkfcrugby.com/fixtures/
  kind: html_list
  source_priority: 1
  # Class-less <table> with <tbody><tr><td>...</td></tr></tbody> rows.
  # Columns: 1=Date(YYYY-MM-DD HH:MM:SS + verbose), 2=Game, 3=Time/Results,
  # 4=League, 5=Venue. The first column's machine-readable ISO at the
  # head is what we extract.
  selectors:
    item: "tbody tr"
    title: "td:nth-of-type(2)"
    date: "td:nth-of-type(1)"
  date_extract_regex: '\d{4}-\d{1,2}-\d{1,2}'
  date_format: "%Y-%m-%d"
  accept_drop_rate: 0.4
  notes: |
    Verified 2026-05-24: 93 fixtures extracted in the test run (mix of
    past + upcoming; render-side future filter keeps the live ones).
    Includes Men's Premiership, Women's Premiership, Championship League
    1, plus age-group fixtures (U14/U16/U18) when published. Date column
    leads with ISO YYYY-MM-DD HH:MM:SS then a verbose copy — the regex
    grabs just the ISO head so dateparser doesn't get confused by the
    duplicate. accept_drop_rate=0.4 covers TBC / bye-week rows.


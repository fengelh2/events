# CONTEMPORARY ART / ALTERNATIVE SPACES
# ============================================================================

- id: hk-arts-centre
  name: Hong Kong Arts Centre
  city: Hong Kong Island          # Wan Chai
  category: mixed
  homepage: https://www.hkac.org.hk
  calendar_url: https://www.hkac.org.hk/en/calendar/
  kind: html_list
  source_priority: 0
  selectors:
    item: ".calendar-event-item"
    title: ".calendar-event-item-title"
    date: ".calendar-event-item-locdate:not(.location)"
    detail_link: "a@href"
  date_extract_regex: '\d{4}\.\d{1,2}\.\d{1,2}\s*[-–—]\s*\d{4}\.\d{1,2}\.\d{1,2}|\d{4}\.\d{1,2}\.\d{1,2}'
  date_format: "%Y.%m.%d"        # YYYY.MM.DD — DMY-mode dateparser otherwise treats 2026 as day
  notes: |
    Major HK Island arts centre in Wan Chai. Houses Pao Galleries +
    Shouson Theatre + Agnès B. Cinema + McAulay Studio. Date format
    "2026.05.23 - 2026.06.14" (YYYY.MM.DD range) — explicit strptime
    pattern handles it (DMY-mode dateparser parses 2026 as "day 2026"
    and fails). Categories in .calendar-event-item-cat (Exhibition /
    Performance / Film / Talk / Workshop).

- id: hk-maritime-museum
  name: Hong Kong Maritime Museum
  city: Hong Kong Island          # Central, Pier 8
  category: museum_exhibition
  homepage: https://www.hkmaritimemuseum.org
  calendar_url: https://www.hkmaritimemuseum.org/all-exhibitions-and-events
  kind: playwright_html_list
  source_priority: 0
  locale: en-US
  wait_for_selector: ".wixui-repeater__item a[href*='/event-details/']"
  extra_wait_ms: 5000
  selectors:
    item: ".wixui-repeater__item:has(a[href*='/event-details/'])"
    title: "h2.wixui-rich-text__text"
    date: "p.wixui-rich-text__text"
    detail_link: "a[href*='/event-details/']@href"
  date_extract_regex: '\d{1,2}/\d{1,2}/\d{2,4}'
  date_format: "%d/%m/%y"          # DD/MM/YY
  accept_drop_rate: 0.4
  notes: |
    Wix site — auto-generated class names everywhere, but the
    wixui-* utility classes are stable. :has() filter scopes the
    repeater items to those with an event-details anchor (skips
    Coming Soon placeholders). Date format DD/MM/YY ("04/07/26").

- id: para-site
  name: Para Site
  city: Hong Kong Island          # Quarry Bay
  category: museum_exhibition
  homepage: https://www.para-site.art
  calendar_url: https://www.para-site.art/exhibitions/
  kind: html_list
  source_priority: 0
  selectors:
    item: "article.exhibition.grid-item"
    title: ".grid-item-title"
    date: ".grid-item-date"
    detail_link: "a@href"
  # Date "Mar 14 – Jun 14 On View" — pull just the range; year is implicit.
  # The "On View" / "Coming Soon" / "Closed" labels are intentionally
  # stripped so dateparser sees only the date itself.
  date_extract_regex: '[A-Z][a-z]{2}\s+\d{1,2}\s*[–—-]\s*[A-Z][a-z]{2}\s+\d{1,2}|[A-Z][a-z]{2}\s+\d{1,2}'
  notes: |
    HK's longest-running independent contemporary art space. Date text
    has no year — dateparser PREFER_DATES_FROM=future infers correctly
    for most rows. 16 exhibitions on the listing (mix of current /
    upcoming / past — render-side future filter handles).


  source_priority: 0
  detail_url_pattern: '/en/cinema/[a-z][a-z0-9-]+/'
  selectors:
    title: "h1"
    date: "body"
  date_extract_regex: '\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  notes: |
    M+ runs a curated cinema programme (retrospectives + festivals + first-runs).
    Detail pages /en/cinema/{slug}/ server-render h1 (English + Chinese) and a
    schedule block whose earliest "DD Mon YYYY" date marks the first screening.

- id: hkiff
  name: Hong Kong International Film Festival (HKIFF / Cine Fan)
  city: Kowloon                  # screenings city-wide; primarily Cultural Centre + Science Museum
  category: film
  homepage: https://www.hkiff.org.hk
  calendar_url: https://www.hkiff.org.hk/film/list
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: '/film/getdetail\?fid=\d+'
  selectors:
    title: "h1"
    date: ".date"                # ".date" contains "DD/MM (DOW)" — first screening
  date_extract_regex: '\d{1,2}/\d{1,2}'
  skip_if_title_matches:
    - '^Programme Update'           # placeholder rows for unannounced films
    - '^TBC'
  accept_drop_rate: 0.3
  notes: |
    HKIFF Society runs the annual HKIFF (Mar-Apr) plus Cine Fan
    Summer IFF (Aug). /film/list exposes /film/getdetail?fid=NNNN
    URLs per film. Detail page h1 = film title, .date = screening
    date (DD/MM with implicit current-festival year). Year-less dates
    rely on dateparser PREFER_DATES_FROM=future to pick the right
    edition. Outside festival windows the listing may be near-empty.

- id: french-may
  name: Le French May
  city: Hong Kong Island          # mostly Alliance Française, various venues
  category: mixed
  homepage: https://www.frenchmay.com
  calendar_url: https://www.frenchmay.com/en/programmes/
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: '/en/programmes/[a-z][a-z0-9-]+/[a-z0-9-]+/'
  selectors:
    title: "h1"
    date: "body"
  date_extract_regex: '\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}'
  notes: |
    Annual French-culture festival, primary season May-Jun. Listing
    at /en/programmes/ has 9 .post-list-card tiles but no date on the
    tile — date is on each detail page. detail_pages parser follows
    /en/programmes/CATEGORY/SLUG/ pattern URLs and pulls h1 + first
    DD-Month-YYYY date from body text.

# ============================================================================
# ROUND-2 DEFERRED VENUES (probed but did not yield real selectors)
# ============================================================================
# Each line documents what was tried + why it failed. None are wired to
# the parser, so the orchestrator silently skips them. Revisit when:
#   - the site swaps to a server-rendered layout, OR
#   - the events listing is no longer empty / off-season, OR
#   - we add the relevant parser kind (e.g. SmartPLAY JSON API)
#
# DEFERRED: tennishk.org — tournament calendar JS-rendered, list empty on
#   static fetch; fallback hkta.tournamentsoftware.com Circuit query also
#   empty (no upcoming tournaments enumerated at probe time).
# DEFERRED: ESF Explore (summer-camp / spring-camp) — pages list camp
#   programmes by date-band ("Week 1: 29 Jun-3 Jul") rather than as
#   discrete cards with selectable containers; would need a custom parser.
# DEFERRED: ESF Multi-Sports Camp — esf.org.hk path 301-redirects to a
#   broken host (esfexplore.org.hkcamps/…) — URL appears to have rotted.
# DEFERRED: ActiveKids HK — landing page only links sub-collection pages

  name: Hong Kong Fringe Club (Workshops)
  display_name: HK Fringe Workshops
  city: Hong Kong Island           # Central
  category: other
  homepage: https://www.hkfringeclub.com
  calendar_url: https://www.hkfringeclub.com/en/whatson/index/6-Workshop.html

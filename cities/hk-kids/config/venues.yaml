# ============================================================================
# PERFORMING ARTS VENUES + AGGREGATOR
# ============================================================================

# ----- LCSD Performing Arts e-Calendar (7 government venues) -----
# Shared backend: performing-arts.gov.hk e-calendar with ?subscribe_code=XXX
# pre-filters to a specific hall. The default page (no code) is empty until
# you trigger a search interaction we haven't reverse-engineered yet — but
# the legacy lcsd.gov.hk/{venue}/programmes/currentmonth.html URLs all 302
# to e-calendar.html?subscribe_code=XXX, so each hall is its own valid URL.
#
# Rendered DOM after JS load: each event row is a `.program-pc-view` inside
# `.search-result-list`. Currently ~11 events/venue (first page); pagination
# exists via .search-program-pager — TODO add multi-page walk.

- id: lcsd-hkcc
  name: Hong Kong Cultural Centre
  city: Kowloon                  # Tsim Sha Tsui waterfront
  category: mixed
  homepage: https://www.performing-arts.gov.hk
  calendar_url: https://www.performing-arts.gov.hk/en/e-calendar.html?subscribe_code=HKCC
  kind: playwright_html_list
  source_priority: 0
  locale: en-US
  wait_for_selector: ".search-result-list .program-pc-view"
  extra_wait_ms: 3000
  selectors:
    item: ".search-result-list .program-pc-view"
    title: ".program-title .h7"
    date: ".program-date.p1"
    detail_link: "@href"          # no detail link in row; falls back to calendar_url
  # Date formats vary: "18/05/2026 (Mon) 20:00" or "06.05.2026 (Wed) 19:30"
  # plus multi-date concatenations. Pull just the first.
  date_extract_regex: '\d{1,2}[./]\d{1,2}[./]\d{4}\s*\([^)]+\)\s*\d{1,2}:\d{2}'
  notes: |
    Primary venue for HK Phil, HK Sinfonietta, major touring acts.
    e-calendar's subscribe_code=HKCC URL pre-applies the venue filter
    so events render on initial page load (no Search-button click).


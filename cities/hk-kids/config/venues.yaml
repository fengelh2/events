  date_extract_regex: '\d{1,2}/\d{1,2}/\d{4}'
  date_find_all: true
  accept_drop_rate: 0.3            # trade-only events have no kid-friendly title
  notes: |
    Verified 2026-05-24: .views-row Drupal rows with .event-title block.
    Example: "Hong Kong Comic Con 2026" / "29/05/2026 - 31/05/2026".
    Catches HKTDC Hong Kong Book Fair, Comic Con, Toy & Game Fair, etc.
    Title text spans the event name AND the dates (separated by <br>) —
    title text-extract will include the date; render-side strips it.
    Date format is DMY which matches the city's date_order=DMY.


    Verified 2026-05-24: .accordion-group rows on the Workshops listing.
    Example: "Discover Swing Dancing-Lindy Hop" / "Wed 27-05-2026".
    Mix of music / dance / craft workshops; render-side kids filter
    keeps family-friendly ones. Detail URLs are /en/whatson/<id>-<slug>.html.

# ----- Harbour City (TST) — mall happenings -----
- id: harbour-city
  name: Harbour City (Tsim Sha Tsui — mall events + pop-ups)
  display_name: Harbour City
  city: Kowloon                    # Tsim Sha Tsui
  category: other
  homepage: https://www.harbourcity.com.hk
  calendar_url: https://www.harbourcity.com.hk/en/event_type/event/
  kind: html_list
  source_priority: 0
  selectors:
    item: ".feature-list-block"
    title: ".feature-list__text h4"
    date: ".timestamp"
    detail_link: ".feature-list__text a@href"
  # Date format: "23–25 May, 2026" or "29 Apr–31 May, 2026" (en-dash range,
  # may straddle months). Pull DD MMM YYYY end-anchor.
  date_extract_regex: '\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*,?\s+\d{4}'
  date_find_all: true              # range: pull first + last DD-MMM-YYYY
  accept_drop_rate: 0.3
  notes: |
    Verified 2026-05-24: .feature-list-block cards inside /en/event_type/event/.
    Example: "GAC-APMG OCEAN TERMINAL CAR SHOW" / "23–25 May, 2026".
    The first date in a "29 Apr–31 May, 2026" string lacks an explicit
    year — date_find_all pulls only the fully-formed DD-MMM-YYYY tokens,
    so single-month ranges parse cleanly. Mall draws family crowds —
    car shows / Lego pop-ups / movie tie-ins typically tagged kid-friendly
    by the audience_filter.

# ----- HKCEC Event Calendar (HKTDC Book Fair, Toy Fair, Comic Con etc.) -----
- id: hkcec
  name: Hong Kong Convention and Exhibition Centre (Event Calendar)
  display_name: HKCEC
  city: Hong Kong Island           # Wan Chai
  category: other
  homepage: https://www.hkcec.com
  calendar_url: https://www.hkcec.com/en/event-calendar

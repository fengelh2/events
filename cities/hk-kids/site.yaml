code: hk-kids
name: HK Kids
flag: "👶"
title: "What's happening in Theo's World"
header_eyebrow: "Kids in Honkers"
city_identity_word: "Honkers"
lang: en
date_order: DMY
timezone: Asia/Hong_Kong
horizon_days: 270
goatcounter_code: fengelh
# Same venue database as adult HK — different VIEW (filter + branding).
# Single source of truth: cities/hk/config/venues.yaml. Scraped once, filtered per-city.
venues_from: hk
# Audience filter logic (in rebuild_calendar.py):
#   1. event.audience == "adults"   → HARD VETO (drops it regardless)
#   2. venue in always_include_venues → admit (venue vouches for all its events)
#   3. event.audience == "kids"     → admit
#   4. title matches kids_keywords  → admit
#   else: drop
audience_filter: kids
# WHITELIST ONLY 100%-kid-focused venues. If a venue has ANY meaningful adult
# programming (Harbour City car shows, HK Sevens party, HKCEC trade fairs,
# HK Park Tai Chi), DO NOT put it here — let the keyword filter decide
# per-event. Venues in this list bypass ALL kid-keyword checks.
always_include_venues:
  # Theme parks & dedicated kid attractions
  - hk-disneyland-events
  - ocean-park-events
  - ocean-park-whatson
  - noahs-ark-hk
  - hk-arcades-kid-friendly
  # Dedicated kids programs (venue's name explicitly contains "kids" or similar)
  - hk-science-museum-kids
  - hk-public-libraries-kids
  - esf-explore-camps
  - activekids-hk
  - hkfc-youth-10s
  - hk-marathon-youth-run
  - hktdc-toy-fair-2027
  # Round-4 kid-only venues (2026-05-25)
  - kids-gallery                # 100% kid arts studio
  - hkru-summer-of-rugby-2026   # static — youth + mini rugby festivals
  # Family nature venues (programming is family-default, no adult-only sessions)
  - kfbg
  - wetland-park
# Title keywords that promote an event into the kids calendar.
# DELIBERATELY narrow — don't use broad sport terms (rugby/football/marathon)
# because they match Men's Pro Championship titles. Use child-specific
# qualifiers ("kids rugby", "mini rugby", "youth football") instead.
kids_keywords:
  # Direct kid signals
  - kid
  - kids
  - child
  - children
  - family
  - families
  # Kid-specific activities
  - puppet
  - storytelling
  - story time
  - fairy
  - lego
  - LEGO
  - magic show
  - parent and child
  - parent & child
  - parent-and-child
  - mom and me
  - dad and me
  - school holiday
  - holiday camp
  - summer camp
  - winter camp
  - spring camp
  - autumn camp
  - junior
  - youth
  - young friends
  - playground
  - kindergarten
  - preschool
  - toddler
  - baby
  - babies
  - infant
  # Kid-specific sport phrasings ONLY (not generic "rugby"/"sport"/"marathon")
  - mini rugby
  - kids rugby
  - youth rugby
  - junior rugby
  - football camp
  - junior tennis
  - mini football
  - youth football
  - youth run
  - kids workshop
  # Round-4 youth-sport jargon (2026-05-25)
  - optimist            # Optimist dinghy class is U15 sailing
  - age group           # "Asian Age Group Championships" = junior swimming
  - feeder scheme       # HKSF Feeder Scheme = junior dinghy
  - 29er                # 29er sailing dinghy = teen class
  - mini sail
  - junior sail
  - youth swimming
  - youth championship
  - schools             # school sport competitions
  # Kid-friendly cultural events
  - balloon
  - mascot
  - carnival
  - parade
  - circus
  # "musical" alone matches too much (Musical Moments, Magic of the Organ).
  # Use specific patterns instead — kid musicals have one of these in the title.
  - the musical          # "Operation Oops! - the Musical" / "Cats the Musical"
  - broadway musical
  - kids musical
  - family musical
  - junior musical
  # Lantern Carnival, family festival patterns
  - lantern carnival
  - family festival
  - kids festival
  - children's festival
  # Kid characters / brands
  - disney
  - pixar
  - peppa
  - moomin
  - hello kitty
  - paw patrol
  - bluey
  - panda
  - snoopy
  - mickey
  - elsa
  - frozen
  - star wars

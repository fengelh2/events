  - for adults
  - adults only
  - adults-only
  - "18+"
  - "21+"
  - over 18
  # NOT bare "teen" — it vetoed "Just Climb — Teen/Kid Climb", a listing
  # that offers a kid band too. Same lesson as U6-U18 in _stated_min_age.
  - teen only
  - teens only
  - for teens
  - teens
  - teenage
  - teenager
  - adolescent
  - secondary school
  - university
  - universities
  - undergraduate
  - masterclass
  - master class
  - advanced

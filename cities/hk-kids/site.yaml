# Same venue database as adult HK — different VIEW (filter + branding).
# Single source of truth: cities/hk/config/venues.yaml. Scraped once, filtered per-city.
venues_from: hk
#
# ── TARGET AGE: 0-5 (retargeted 2026-09-08) ──────────────────────────────────
# This calendar is for a toddler/preschooler, NOT for school-age kids. Before
# 2026-09-08 it was a broad 0-12 view and was dominated by older-kid content:
# 85 U11-U18 ice-hockey fixtures, U10-U14 baseball tournaments, judo
# championships, "ages 13+" ballet masterclasses, HK Phil main-series concerts
# (Beethoven 5, Doctor Atomic, Zarathustra), 10x LCSD "Cantonese Operatic Songs
# Concert", plus outright adult leaks ("improvised puppet show for adults",
# "LEGO SERIOUS PLAY for Teams", a bar called Terrible Baby).
#
# Calibration is LENIENT: drop clear misfits only. Anything plausibly fine with
# a 3-year-old stays (Peppa Pig, Frozen Live in Concert, Disney, malls, soft
# play, Ocean Park, nature parks). Only stated-6+/teen/adult content is cut.
#
# Filter order (rebuild_calendar.py `audience_filter: kids`):
#   1. event.audience == "adults"      → HARD VETO
#   2. title matches veto_keywords     → HARD VETO (beats always_include)
#   3. venue in exclude_venues         → HARD VETO (beats always_include)
#   4. title STATES a min age > 5      → HARD VETO (beats always_include)
#   5. venue in always_include_venues  → admit
#   6. event.audience == "kids"        → admit
#   7. title matches kids_keywords     → admit
#   else: drop
audience_filter: kids
# Age ceiling for the stated-age veto. A title that states no age is never
# touched by this rule — it only acts on explicit evidence ("ages 6+", "U14",
# "12-14"). "Ages 5-14" survives (a 5-year-old qualifies); "Ages 12-14" doesn't.
max_start_age: 5

# ── HARD VETOES ──────────────────────────────────────────────────────────────
# Venues whose programming is structurally school-age-or-older. These beat the
# whitelist, so a venue must NOT appear in both lists.
exclude_venues:
  # Competitive youth leagues — fixtures, tournaments, medal games. Nothing a
  # 0-5 can join, and they flooded the calendar (85 + 10 + 6 events).
  - hkihl-ice-hockey        # U11-U18 league fixtures
  - hk-baseball-youth       # U10-U14 tournaments + coach seminars
  - hk-judo                 # championships / kyu-grade tournaments
  - hktkda-taekwondo        # championships
  - hockey-hk-fixtures      # league fixtures
  - cricket-hk-junior       # junior league
  - hkaaa-athletics         # athletics championships
  - hkfc-youth-10s          # name says it: 10-year-olds
  - hk-marathon-youth-run   # min entry age well above 5
  - hkba-badminton-courses  # HKBA intake starts age 6
  # Mixed-programming venues that were whitelisted and leaked adult content.
  # Removed from always_include rather than excluded outright would still leak
  # via keywords, so veto them and let genuinely-kid titles back in by keyword.
  - mplus-cinema            # art-house film festival, not family cinema
  - hkiff-cine-fan          # arthouse retrospectives (admitted "Family Nest", a 1977 Hungarian drama)
  # Trade-only fair (not open to the public)
  - hktdc-toy-fair-2027

# Title substrings that drop an event outright, even from a whitelisted venue.
# These are the patterns that made the old calendar unusable for a 3-year-old.
veto_keywords:

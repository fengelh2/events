  # Round-7 family-friendly venues (2026-05-26, refined 2026-05-26 round-2)
  # Only venues whose programming is OVERWHELMINGLY kid/family by default.
  # Mixed museums (M+, HK Museum of Art, Palace Museum, Tai Kwun, HKU Museum)
  # had too many adult shows leaking in ("When Art Meets Horse Racing",
  # "Heavenly Horses Masterpieces") — REMOVED, rely on kids_keywords instead.
  - mplus-cinema                # cinema — most films family-suitable
  - hk-science-museum           # interactive — kid-friendly default
  - hk-space-museum             # planetarium — kid-friendly default
  - hkpl-events                 # public library — story time + workshops
  - new-town-plaza              # mall — carnival/family default
  - harbour-city                # mall — family default (car shows, mascots)
  - hk-park-events              # HK Park (aviary, sport courts)
# Title keywords that promote an event into the kids calendar.
# DELIBERATELY narrow — don't use broad sport terms (rugby/football/marathon)
# because they match Men's Pro Championship titles. Use child-specific
# qualifiers ("kids rugby", "mini rugby", "youth football") instead.
kids_keywords:
  # Direct kid signals
  - kid
  - kids
  - child
  - children
  - family
  - families
  # Kid-specific activities
  - puppet
  - storytelling
  - story time
  - fairy
  - lego
  - LEGO
  - magic show

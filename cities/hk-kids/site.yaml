# ── ADMIT: whitelisted venues ────────────────────────────────────────────────
# ONLY venues whose programming works for an under-5. Venues in this list bypass
# the keyword admit check but NOT the vetoes above.
always_include_venues:
  # Theme parks & dedicated attractions
  - hk-disneyland-events
  - ocean-park-events
  - ocean-park-whatson
  - noahs-ark-hk
  - hk-arcades-kid-friendly     # indoor playgrounds, Snoopy World
  # Dedicated young-child programmes
  - hk-science-museum-kids       # ALL its rows are kid workshops - safe to whitelist
  # NOT hk-public-libraries-kids: its feed is ALL library programmes (adult
  # calligraphy, writing courses, Cantonese opera talks). Keywords admit the
  # 0-5 rows ("Storytelling for Children", "Parent-child Workshop") instead.
  - kids-gallery                # kid arts studio, open play from toddler age
  - parentmap-hk                # dedicated HK 親子 listings site, 100% family
  # Sport / movement providers that run genuine toddler & preschool classes
  - hkfa-grassroots             # grassroots football from age 4
  - esf-sports-classes
  - apss-soccer-school
  - harry-wright-swim           # baby & parent-and-child swimming
  - ymca-multisport
  - trybe-gym-ninja
  - hkjc-public-riding          # pony rides
  - lcsd-comm-rec-sports
  - ryze-hk                     # trampoline park — toddler sessions
  - bounce-hk                   # trampoline park — mini-bouncer sessions
  - cityplaza-ice-palace
  - megaice-skating
  - vermcity-climbing
  - just-climb
  - attic-v-climbing
  - surf-hk-kids
  - hk-ballet-academy           # keeps Pre-Ballet (ages 4-5); the "ages 13+"
  - hkyba-ballet                #   masterclasses are cut by max_start_age
  # Nature & family venues (programming is family-default)
  - kfbg
  - wetland-park
  - hk-space-museum             # planetarium
  - hk-park-events              # HK Park (aviary, playgrounds)
  # NOT whitelisted (deliberate): hkpl-events, new-town-plaza, harbour-city.
  # Whitelisting them admitted adult library book displays ("Sci-fi May",
  # "Home Design") and mall marketing rows ("Spend and earn HK$6,140
  # rebate"). Their real kid programming still arrives via kids_keywords
  # ("Children's Book Display", "family", "carnival").

# ── ADMIT: title keywords ────────────────────────────────────────────────────
# Promotes an event from a NON-whitelisted venue into the calendar.
# Retuned 2026-09-08 for 0-5. Removed: junior / youth / schools / primary
# school / age group / feeder scheme / optimist / 29er / mini rugby / junior
# tennis / youth football / youth run / ages 6-10 — all school-age-or-older.
# Removed the HK Phil & LCSD adult-programme keywords (swire music for
# everyone, swire symphony under, john williams, hisaishi, nutcracker,
# planet earth, video game symphony, movie music, community concert,
# side-by-side, cello/voice festival, cantonese opera, variety show, annual

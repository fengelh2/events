- id: skirball
  name: Skirball Cultural Center
  city: Westside
  category: museum_exhibition
  homepage: https://www.skirball.org
  calendar_url: https://www.skirball.org/calendar
  kind: static
  source_priority: 0
  static_events: []
  notes: |
    Static umbrella 2026-05-28. /calendar uses a Drupal "skirball-calendar"
    layout where each day is one `.skirball-calendar--results` block holding
    a `<header>` with the date and a nested `<ol>` of multiple events. The

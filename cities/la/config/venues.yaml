- id: a-noise-within
  name: A Noise Within
  city: Pasadena & East
  category: theatre
  homepage: https://www.anoisewithin.org
  calendar_url: https://www.anoisewithin.org/event-calendar/
  kind: static
  source_priority: 0
  static_events: []
  notes: |
    Static umbrella 2026-05-28. /event-calendar/ DOES expose 21
    `.calendar-instance-popup` performance blocks server-side, but the date

- id: geffen-playhouse
  name: Geffen Playhouse
  city: Westside
  category: theatre
  homepage: https://www.geffenplayhouse.org
  calendar_url: https://www.geffenplayhouse.org/shows/
  kind: html_list
  source_priority: 0
  selectors:
    item: "div.show-card"
    title: ".show-details"
  accept_drop_rate: 0.5
  date_from_title: true
  # Format "06.10 — 07.12.2026" (MM.DD — MM.DD.YYYY). The start date has no
  # year, so we capture the END date (always full MM.DD.YYYY) and let that
  # represent the run. Renders the closing performance as the event date —
  # the show actually runs for ~4 weeks before; acceptable for v1.
  date_from_title_pattern: '\d{1,2}\.\d{1,2}\.\d{4}'
  notes: |
    Westwood (Westside). /shows/ renders 6 `div.show-card` blocks (the cards
    themselves are divs; only the homepage uses `a.show-card` wrappers).
    Date sits in `.show-details p.uk-h1` as "06.10 — 07.12.2026". We use
    date_from_title range mode to capture the run; site.yaml date_order MDY
    handles the parsing. Tessitura subdomain (secure.geffenplayhouse.org)
    DOES expose TNEW pages but its /events listing renders empty — the
    public /shows page is the cleanest source. Onboarded 2026-05-28.

- id: wallis-annenberg
  name: Wallis Annenberg Center for the Performing Arts
  city: Westside
  category: mixed
  homepage: https://thewallis.org
  calendar_url: https://thewallis.org/wallis_calendar
  kind: playwright_html_list
  source_priority: 0
  selectors:
    item: "tr.list-cal-row"
    title: ".event_title"
    date: "td:first-child"
    detail_link: "a@href"
  notes: |
    Beverly Hills (Westside). Calendar widget on /wallis_calendar (FullCalendar
    JS) renders both grid AND list views; we read the list view's
    `tr.list-cal-row` rows. Each row's first `<td>` carries "May 7, 2026" plus
    a `<br>` then "7:30 PM" — dateparser eats both. ~12 rows per page (one
    per performance, includes recurring runs). Re-probed 2026-05-28. The
    `tickets.thewallis.org` Tessitura subdomain has TNEW markup too but
    `/events` returns 404 — the public calendar URL is more reliable.

- id: american-cinematheque
  name: American Cinematheque (Egyptian / Aero / Los Feliz)
  city: Central LA
  category: film
  homepage: https://americancinematheque.com
  calendar_url: https://americancinematheque.com/feed/
  kind: static
  source_priority: 0
  static_events: []
  notes: |
    Static umbrella 2026-05-28. Two paths investigated, both blocked:
    (1) /feed/ is a WordPress RSS of editorial posts (festival announcements,
        not individual screenings). pubDate is post-publication time, not the
        screening date. No `kind: rss` parser exists yet, and the feed doesn't
        carry per-screening dates anyway.
    (2) /now-showing/ uses a Vuetify v-calendar widget — events come from a
        JS `monthSelection` build, not server-rendered cards. `showMore`
        elements appear but carry no parseable date in attributes.
    Re-onboard if AmCin publishes an iCal or moves to a server-rendered
    schedule grid.


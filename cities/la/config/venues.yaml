- id: ctg
  name: Center Theatre Group (Mark Taper / Ahmanson / Kirk Douglas)
  city: Central LA
  category: theatre
  homepage: https://www.centertheatregroup.org
  kind: static
  source_priority: 0
  static_events: []
  notes: |
    Static umbrella 2026-05-28. queue-it bot wall blocks both the homepage and
    tickets.centertheatregroup.org (302 → ctgla.queue-it.net challenge page).

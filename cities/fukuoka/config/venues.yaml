# --- AGGREGATORS (the biggest lever) ----------------------------------------

- id: gofukuoka-jp
  name: Go Fukuoka (City Tourism — search/events)
  city: Hakata
  category: other
  homepage: https://gofukuoka.jp
  calendar_url: https://gofukuoka.jp/searches?q=&story%5B%5D=event
  kind: detail_pages
  source_priority: 1
  detail_url_pattern: '/events/detail/[a-f0-9-]{36}'
  # h1[0] is the page nav "Events"; h1[1] is the real event title.
  # _select_text returns the FIRST match — use h2 or :nth-of-type(2), but
  # parser uses select_one. Workaround: title-class anchor in main content.
  selectors:
    title: ".post-content h1"
    date: "body"
  date_extract_regex: '(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},?\s*\d{4}'
  accept_drop_rate: 0.5
  notes: |
    Reprobe 2026-05-21 contradicted Round-1 finding: gofukuoka.jp IS
    server-rendered (the cards are visible in static HTML, ~13 events linked
    as /events/detail/<uuid>). Listing has titles but no inline dates →
    detail_pages with UUID regex + body-wide 年月日 extraction. Complements
    yokanavi-fukuoka (which uses numeric /events/<id> pattern on a different
    sub-portal of the same Fukuoka City tourism platform). Both kept — they
    surface partially overlapping but mostly distinct event sets (different
    editorial curation rules per portal).


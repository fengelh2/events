- id: fukuoka-prefectural-museum-of-art
  name: Fukuoka Prefectural Museum of Art 福岡県立美術館
  city: Tenjin & Daimyō               # Tenjin Central Park
  category: museum_exhibition
  homepage: https://fukuoka-kenbi.jp
  calendar_url: https://fukuoka-kenbi.jp/
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: 'https://fukuoka-kenbi\.jp/exhibition/20\d{2}/\d{4}_\d+/?'
  selectors:
    title: "h1, h2"
    date: "body"
  date_extract_regex: '\d{4}年\d{1,2}月\d{1,2}日(?:[（(][^）)]+[）)])?\s*[〜～~]\s*\d{4}年\d{1,2}月\d{1,2}日(?:[（(][^）)]+[）)])?'
  date_format: "%Y年%m月%d日"
  accept_drop_rate: 0.3
  notes: |
    福岡県立美術館 — Tenjin Central Park, the prefectural sibling of the
    Ōhori-Park Fukuoka City Art Museum. Homepage links to per-exhibition
    detail pages at /exhibition/YYYY/MMDD_NNNNN/. Recon 2026-05-21 confirmed
    3 active/upcoming: Yanase Takashi (Apr 17 - Jun 14, 2026), Collection
    Treasures vol.1 (Mar 17 - May 24), 81st Prefectural Art Exhibition
    (Sep 1-27, 2026). Date stored as "2026年4月17日（金）〜6月14日（日）" in body
    prose. Detail-pages parser walks the slug pattern; date_format pins
    strptime to avoid DMY dateparser misreading "2026年" as a day token.


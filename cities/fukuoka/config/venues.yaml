# no Fukuoka section exists as of 2026-05-21.
# DEFERRED: Peatix Japan / Eventbrite Japan / Walker Plus — Peatix shows static
# nav only (events load via JS); Eventbrite serves wrong-region content for
# /japan--fukuoka/; Walker Plus needs Playwright. Viable in v2; for now
# Fukuoka Now + Yokanavi provide adequate aggregator coverage.

    博多座ガムラン祭り pre-events, 特別展 exhibitions, workshop体験会) that
    don't appear elsewhere. Cards are <a href="/news/detail.php?id=N">
    wrapping image + title + 2026年M月D日 date. Recon 2026-05-21 confirmed
    10 dated entries on the front page. accept_drop_rate covers help/admin
    posts without an event date. skip_if_title_matches drops members-only
    (会員限定) admin notices.

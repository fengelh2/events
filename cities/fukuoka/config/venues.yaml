- id: fukuoka-asian-art-museum
  name: Fukuoka Asian Art Museum 福岡アジア美術館
  city: Hakata                        # Riverain building, Nakasu side of Hakata
  category: museum_exhibition
  homepage: https://faam.city.fukuoka.lg.jp/en/
  calendar_url: https://faam.city.fukuoka.lg.jp/en/exhibition-event/
  kind: html_list
  source_priority: 0
  selectors:
    item: ".top-hero-main-content-item"
    title: ".top-hero-main-content-item__title--sp"
    date: ".top-hero-main-content-item__date"
    detail_link: "a.top-hero-main-content-item__inner@href"
  date_extract_regex: '(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s*\d{4}'
  # Round-2 audit 2026-05-21: only 1 of 6 swiper cards has a non-empty
  # .top-hero-main-content-item__date span (others are placeholder slides).
  # The drop is structural, not parser bug — bump accept_drop_rate to 0.9
  # so the WARN doesn't fire on every refresh.
  accept_drop_rate: 0.9
  notes: |
    福岡アジア美術館 — Fukuoka Asian Art Museum. Signature contemporary-Asian
    art venue. English /en/exhibition-event/ — 6 .top-hero-main-content-item
    cards (swiper carousel, fully server-rendered). The __title--sp variant
    holds the single-line title; __title--pc has <br>-broken multiline copy.
    Date span "Apr 18, 2026 - Aug 30, 2026" inside __date — date_find_all
    captures start+end.

- id: fukuoka-art-museum
  name: Fukuoka Art Museum 福岡市美術館
  city: Tenjin & Daimyō               # Ōhori Park
  category: museum_exhibition
  homepage: https://www.fukuoka-art-museum.jp/en/
  calendar_url: https://www.fukuoka-art-museum.jp/en/exhibition/
  kind: html_list
  source_priority: 0
  selectors:
    item: "article.c-article-contents"
    title: "h2, h3, .ex_thumb_info h3"
    date: ".ex_thumb_info p"
    detail_link: "a@href"
  date_extract_regex: '(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{1,2}(?:st|nd|rd|th)?,?\s+\d{4}'
  accept_drop_rate: 0.4
  notes: |
    福岡市美術館 — Fukuoka City Art Museum (Ōhori Park). /en/exhibition/ has
    article.c-article-contents cards with .ex_thumb_info paragraph holding
    "Sat. Apr. 18th, 2026 - Sun. Jun. 21st, 2026". date_find_all gets both
    endpoints. Regex tolerates the weekday + ordinal suffix.

- id: kyushu-national-museum
  name: Kyushu National Museum 九州国立博物館
  city: Around Fukuoka                # Dazaifu — 30min from central Fukuoka
  category: museum_exhibition
  homepage: https://www.kyuhaku.jp/en/
  calendar_url: https://www.kyuhaku.jp/en/
  kind: html_list
  source_priority: 0
  selectors:
    item: ".entry.col-md-6"
    title: "h3, h2, .entry-title"
    date: ".d-none.d-xl-block, .d-block.d-xl-none, p"
    detail_link: "a@href"
  date_extract_regex: '\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)(?:\s*\([^)]+\))?\s+\d{4}'
  notes: |
    Major national museum in Dazaifu (UNESCO area, 30min train from Hakata).
    /en/ homepage lists exhibitions inside .entry.col-md-6 Bootstrap-card
    blocks. Native format "21 April (Tue)–14 June (Sun) 2026" — regex strips
    the weekday parens and dash, capturing just the year-bearing "14 June 2026"
    or "20 July 2026" end date (date_text re.search picks the LAST match that
    contains year). Single-day extraction (end-of-range) — long-running
    exhibitions still appear in calendar through their final date as proxy.


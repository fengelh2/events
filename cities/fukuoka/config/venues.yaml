- id: hakataza
  name: Hakataza Theatre 博多座
  city: Hakata
  category: theatre                   # also kabuki (June + September runs)
  homepage: https://www.hakataza.co.jp
  calendar_url: https://www.hakataza.co.jp/lineup/
  kind: html_list
  source_priority: 0
  selectors:
    item: ".showcase__box"
    title: ".showcase__title"
    date: ".showcase__schedule"
    detail_link: "a[href*='/lineup/']@href"
  date_extract_regex: '\d{4}年\d{1,2}月\d{1,2}日'
  date_format: "%Y年%m月%d日"
  accept_drop_rate: 0.2
  notes: |
    博多座 — Hakata-za. Kabuki, large-scale musicals (Miss Saigon, Funny Girl,
    SPY×FAMILY, BOOP!, Charlie & the Chocolate Factory), enka concerts.
    /lineup/ has 17 .showcase__box cards. .showcase__schedule holds full date
    range "2026年5月6日(水・振休)～28日(木)"; extracting just the start date
    (first 年月日). Recurring multi-week runs collapse render-side per global
    recurrence rules. category_keyword_overrides not needed — kabuki naturally
    falls under "theatre" bucket in the global classifier.

# DEFERRED: Fukuoka Performing Arts Centre (FPAC) — fpac.or.jp + fpac.fukuoka.jp
# both refused connection during recon (ECONNREFUSED 2026-05-21).
# DEFERRED: Fukuoka Civic Hall (市民会館 / f-shimin.jp) — connection refused.


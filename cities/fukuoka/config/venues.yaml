# Fukuoka cultural-events venues. Populated by recon agent.
#
# Language policy: UI English. Japanese titles kept as-is (HK pattern —
# don't translate). Prefer the English toggle of bilingual sites; use the
# Japanese version only when no English exists.
#
# Geographic zones (Fukuoka districts):
#   "Hakata"            — Hakata ward, station area, Canal City
#   "Tenjin & Daimyō"   — Tenjin shopping/cultural core, Ōhori area
#   "Momochi & Bayside" — Momochihama (museums, Hawks Town), seaside
#   "Around Fukuoka"    — Kitakyūshū, Dazaifu, anywhere outside Fukuoka City
#
# Date format: ISO YYYY-MM-DD when available (Japanese sites), else M/D.
# Time zone: Asia/Tokyo (JST, UTC+9, no DST).

# ============================================================================
# MUSIC / CONCERT / ORCHESTRA
# ============================================================================

- id: acros-fukuoka
  name: ACROS Fukuoka Symphony Hall
  city: Tenjin & Daimyō
  category: concert
  homepage: https://www.acros.or.jp
  calendar_url: https://www.acros.or.jp/events/sponsored.php
  kind: html_list
  source_priority: 0
  selectors:
    item: "ul#event_list > li"
    title: "h2"
    date: ".text > time"
    detail_link: "a@href"
  date_extract_regex: '\d{4}年\d{1,2}月\d{1,2}日'
  date_format: "%Y年%m月%d日"
  notes: |
    Fukuoka's flagship performing-arts complex (Tenjin). Sponsored/co-sponsored
    series at /events/sponsored.php — server-rendered list. Each card is an
    <li> under ul#event_list with .text > time (Japanese 年月日 + 曜日 + HH:MM)
    and <h2> wrapping the production title (with .series prefix). English /en/
    paths 404; JP page is canonical. Titles stored as-is (Japanese OK per HK
    pattern). 63 events recon'd 2026-05-21. event_caution paragraphs hold
    ticket-onsale dates (also in 年月日 form) — date_extract_regex picks the
    FIRST date match which is the performance time from the leading <time>.

# DEFERRED: kyushu-symphony — 九州交響楽団. /ticket/list.php has clean concert
# data (5 active concerts as of 2026-05-21) but the DOM is awkward: each
# concert is an <h3> (title) followed by sibling <div class=article>(date),
# with no per-concert wrapper element. CSS adjacency selectors can't bridge
# the gap in the generic html_list parser. Coverage gap is partially mitigated
# by acros-fukuoka (which hosts most Kyushu Symphony concerts as the venue).
# Wire a custom adjacency-walk path in v2.

- id: bluenote-fukuoka
  name: BLUE NOTE Fukuoka (Blue Note Place Fukuoka)
  city: Tenjin & Daimyō
  category: concert
  homepage: https://www.bluenote.co.jp/jp/fukuoka/
  calendar_url: https://www.bluenote.co.jp/jp/fukuoka/schedule/
  kind: playwright_html_list
  source_priority: 1
  locale: ja-JP
  wait_for_selector: "a[href*='/artists/']"
  extra_wait_ms: 3500
  selectors:
    item: "li:has(a[href*='/artists/'])"
    title: "a[href*='/artists/']"
    date: "strong, .date, time"
    detail_link: "a[href*='/artists/']@href"
  date_extract_regex: '\d{4}\s+\d{1,2}\.\d{1,2}(?:\s*[a-z]{3}\.?)?(?:[,，]\s*\d{1,2}\.\d{1,2}(?:\s*[a-z]{3}\.?)?)*'
  accept_drop_rate: 0.5
  notes: |
    Blue Note Japan's Fukuoka outpost (jazz / soul / contemporary). The
    fukuoka-bluenote.com domain refuses connection; bluenote.co.jp/jp/fukuoka
    is the working host. Schedule grid is a JS-rendered calendar (only 2 dates
    in static HTML) — Playwright required. Each show is a <li> with anchor
    /artists/<slug> and "2026 5.20 wed., 5.21 thu." in a <strong>. Multi-night
    runs concatenate dates; regex captures them all (parser uses first).

- id: marine-messe-fukuoka
  name: Marine Messe Fukuoka
  city: Hakata                        # Okihama, near Hakata Port
  category: concert                    # arena — mostly large concerts + sports
  homepage: https://www.marinemesse.or.jp
  calendar_url: https://www.marinemesse.or.jp/messe/event/
  kind: playwright_html_list
  source_priority: 1
  locale: ja-JP
  wait_for_selector: "a[href*='/events/detail/']"
  extra_wait_ms: 4000
  selectors:
    item: "li:has(a[href*='/events/detail/'])"
    title: "h3, .title, img@alt"
    date: ".date, time, p"
    detail_link: "a[href*='/events/detail/']@href"
  date_extract_regex: '\d{4}[./年]\s*\d{1,2}[./月]\s*\d{1,2}日?'
  accept_drop_rate: 0.5
  notes: |
    Major arena complex (Marine Messe A + B + Convention Center). Hosts large
    touring concerts, idol shows, sports, trade fairs. Static HTML has 0 date
    strings — listing is JS-rendered, so Playwright. Event rows link to
    /events/detail/<id>. Mixed types — trade-show entries lack clean dates,
    hence accept_drop_rate.

# DEFERRED: FFG Hall (Fukuoka Financial Group concert hall) — no public schedule
# page; programs surface via kyushu-symphony entries and aggregators.

# DEFERRED: Drum Logos / Drum Be-1 / Fukuoka Kokusai Center / IMS Hall —
# drumlogos.jp + similar live-house circuits refused connection during recon

- id: kbc-cinema
  name: KBC Cinema
  city: Tenjin & Daimyō
  category: cinema
  homepage: https://www.kbc-cinema.com
  calendar_url: https://www.kbc-cinema.com/
  kind: playwright_html_list
  source_priority: 1
  locale: ja-JP
  wait_for_selector: "a[href*='/pages/movies/']"
  extra_wait_ms: 4000
  selectors:
    item: "a[href*='/pages/movies/']:has(img)"
    title: "img@alt"
    date: "p, span, .date"
    detail_link: "@href"
  date_extract_regex: '\d{1,2}月\d{1,2}日(?:\([日月火水木金土]\))?(?:\s*[～〜~]\s*\d{1,2}月\d{1,2}日(?:\([日月火水木金土]\))?)?'
  accept_drop_rate: 0.7
  notes: |
    Independent cinema in Tenjin (arthouse / international / subtitled).
    Homepage Shopify-style storefront; static HTML has 0 date strings (dates
    appear in JS-rendered showtime widgets). Playwright with /pages/movies/
    anchor scan. High drop_rate — many cards lack explicit start dates
    (open-ended runs labelled "上映中"). Title in poster <img alt>, dates in
    "5月22日(金)～5月28日(木)" inline text.

# DEFERRED: T·Joy Hakata / United Cinemas Canal City / Cinepleks Tenjin —
# fukuoka-tjoy.com refused connection; large chains use SPA showtime pickers
# that need Playwright + per-date probing. Aggregators (Fukuoka Now, Yokanavi)
# already index film-festival coverage.


- id: kbc-cinema-static
  name: KBC Cinema (homepage — static)
  city: Tenjin & Daimyō
  category: film
  homepage: https://www.kbc-cinema.com
  calendar_url: https://www.kbc-cinema.com/
  kind: detail_pages
  source_priority: 1
  detail_url_pattern: '/pages/movies/[a-z0-9-]+'
  selectors:
    title: "title"
    date: "body"
  date_extract_regex: '\d{1,2}月\d{1,2}日(?:\([日月火水木金土]\))?(?:\s*[～〜~]\s*\d{1,2}月\d{1,2}日(?:\([日月火水木金土]\))?)?'
  title_strip_suffixes:
    - "– KBCシネマ1・2"
    - "- KBCシネマ1・2"
  notes: |
    Static-HTML re-probe of KBC Cinema (Round-2 2026-05-21). Round-1 assumed
    JS-rendered showtime widget; actual homepage is Shopify-style storefront
    with <a href="/pages/movies/SLUG"><img alt="TITLE"/>TITLE\nDATE</a>.
    16 films confirmed via WebFetch (e.g. ペリカン・ブルー 5月22日(金)～5月28日(木),
    霧のごとく 5月29日(金)～6月11日(木), ヴィヴァルディと私). Open-ended runs
    ("上映中") naturally drop via accept_drop_rate.


# AGGREGATORS
# ============================================================================

- id: fukuoka-now
  name: Fukuoka Now (English magazine — Events)
  city: Tenjin & Daimyō               # editorial coverage spans whole city
  category: other
  homepage: https://www.fukuoka-now.com/en/
  calendar_url: https://www.fukuoka-now.com/en/event/
  kind: html_list
  source_priority: 0
  selectors:
    item: "li.c-page-sub__guide-item"
    title: "h2, h3, .c-event-card__title, a"
    date: ".c-event-date__start time, .c-event-date time"
    detail_link: "a[href*='/en/event/']@href"
  date_extract_regex: '(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.\s+\d{1,2}\b'
  date_format: "%b. %d"
  accept_drop_rate: 0.4
  notes: |
    English-language Fukuoka events magazine — top aggregator for non-Japanese
    audience. Cards li.c-page-sub__guide-item with .c-event-date__start time
    holding short "May. 21" or range "May. 30-31". Regex captures FIRST single
    date "May. 21" (start only). date_format pins parse against current-year
    template so dateparser doesn't read trailing day-of-month as a year token.

- id: yokanavi-fukuoka
  name: Yokanavi (Fukuoka City Tourism — events)
  city: Hakata                        # official tourism site
  category: other
  homepage: https://gofukuoka.jp
  calendar_url: https://gofukuoka.jp/searches?q=&story%5B%5D=event&who%5B%5D=
  kind: playwright_html_list
  source_priority: 1
  locale: ja-JP
  wait_for_selector: "a[href*='/events/detail/']"
  extra_wait_ms: 4000
  selectors:
    item: "li:has(a[href*='/events/detail/'])"
    title: "h3, h2, a"
    date: ".date, p, time"
    detail_link: "a[href*='/events/detail/']@href"
  date_extract_regex: '\d{4}[./年]\d{1,2}[./月]\d{1,2}日?(?:\s*[～〜~–-]\s*\d{4}?[./年]?\d{1,2}[./月]\d{1,2}日?)?'
  accept_drop_rate: 0.5
  notes: |
    yokanavi.com/en/event 301-redirects to gofukuoka.jp — Fukuoka City's
    official tourism portal (rebranded 2026). Listing JS-rendered (0 dates in
    static HTML) — Playwright required. Events at /events/detail/<id>. Mixed
    types (exhibitions, festivals, races, marathons) — high drop_rate because
    list page indexes long-running shows already covered by per-venue scrapers;
    render-side dedup collapses overlap.

# DEFERRED: TimeOut Fukuoka — TimeOut Japan covers Tokyo/Osaka/Kyoto only;
# no Fukuoka section exists as of 2026-05-21.
# DEFERRED: Peatix Japan / Eventbrite Japan / Walker Plus — Peatix shows static

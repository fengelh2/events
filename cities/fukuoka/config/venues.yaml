- id: fukuoka-now
  name: Fukuoka Now (English magazine — Events)
  city: Tenjin & Daimyō               # editorial coverage spans whole city
  category: other
  homepage: https://www.fukuoka-now.com/en/
  calendar_url: https://www.fukuoka-now.com/en/event/
  kind: html_list
  source_priority: 0
  selectors:
    item: "li.c-page-sub__guide-item"
    title: "h2, h3, .c-event-card__title, a"
    date: ".c-event-date__start time, .c-event-date time"
    detail_link: "a[href*='/en/event/']@href"
  date_extract_regex: '(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.\s+\d{1,2}\b'
  date_format: "%b. %d"
  accept_drop_rate: 0.4
  notes: |
    English-language Fukuoka events magazine — top aggregator for non-Japanese
    audience. Cards li.c-page-sub__guide-item with .c-event-date__start time
    holding short "May. 21" or range "May. 30-31". Regex captures FIRST single
    date "May. 21" (start only). date_format pins parse against current-year
    template so dateparser doesn't read trailing day-of-month as a year token.

- id: yokanavi-fukuoka
  name: Yokanavi (Fukuoka City Tourism — events)
  city: Hakata                        # official tourism site
  category: other
  homepage: https://yokanavi.com
  calendar_url: https://yokanavi.com/event/
  kind: detail_pages
  source_priority: 1
  detail_url_pattern: '/events/\d+'
  selectors:
    title: "h1"
    date: "body"
  date_extract_regex: '\d{4}年\d{1,2}月\d{1,2}日'
  date_format: "%Y年%m月%d日"
  accept_drop_rate: 0.3
  notes: |
    Round-2 rewrite 2026-05-21: switched from gofukuoka.jp Playwright path to
    yokanavi.com/event/ direct. yokanavi.com is the user-facing Fukuoka City
    tourism portal (the gofukuoka.jp 301 chain was a red herring — yokanavi
    serves its own server-rendered HTML at /event/ with ~13 events linked as
    /events/<numeric_id>). Listing page has NO inline dates so we use
    detail_pages kind: regex extracts /events/\d+ URLs from the listing, then
    each detail page yields h1 title + first 年月日 date in body. Range dates
    "2026年5月23日(土曜日)、5月24日(日曜日)" → first match = start date.
    ~13 events per refresh (front page only; pagination at /event/?paged=N
    requires page-number support not yet in scraper).


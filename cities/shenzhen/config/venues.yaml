# Shenzhen cultural-events venues. Populated by recon agent 2026-05-21.
#
# Language policy: UI English. Chinese titles kept as-is (HK pattern —
# don't translate). Prefer the English toggle of bilingual sites; use the
# Chinese version only when no English exists.
#
# Geographic zones (Shenzhen districts):
#   "Futian"            — Futian CBD, government, Civic Center, central museums
#   "Luohu"             — Old town, Dongmen, original concert halls + theatres
#   "Nanshan & OCT"     — Nanshan tech belt, OCT-LOFT arts cluster, Shekou
#   "Longgang & East"   — Longgang (Universiade Center, MIXC Shenzhen Bay area)
#   "Bao'an & Outer"    — Bao'an, Longhua, Pingshan, airport area
#
# Date format: ISO YYYY-MM-DD or 年月日 (zh). Time zone: Asia/Shanghai (CST, UTC+8).
#
# ============================================================================
# IMPORTANT — GREAT FIREWALL REVERSE-BLOCK FINDING (2026-05-21 recon)
# ============================================================================
# Recon attempted 30+ Shenzhen-specific .cn / .com.cn / mainland-hosted
# domains from this network. The result:
#
#   ECONNREFUSED (TCP RST from CN edge): sso.org.cn, polysztheatre.com,
#     hxnart.com, ocat.org.cn, szam.org, gsyart.com, hua-art.com,
#     bc-sz.com, bcube.com.cn, timeoutshenzhen.com, visitshenzhen.com,
#     seaworldculture.com, shenzhenparty.com (301→nowshenzhen),
#     shenzhen-standard.com (301→nowshenzhen), szdaily.com,
#     shenzhenpages.com, szwindow.com, mocape.com (empty body)
#   Timeout/empty body (JS-rendered + WAF): shenzhenconcerthall.com,
#     shenzhenmuseum.com, eyeshenzhen.com event listing pages
#   Cert expired: damai.cn  |  500/404: maoyan/showstart probes
#
# This is structural — CN sites geo-filter/RST non-CN egress IPs at the
# TCP layer. Not fixable in YAML. Two mitigations exist but neither was
# in scope for this onboarding pass:
#   1. Move scraper egress to a Chinese-egress runner (VPS in HK/CN)
#   2. Use Playwright with residential proxy (cost + maintenance)
#
# WHAT THIS YAML SHIPS: the ~3 sources that DID respond cleanly from
# this network, with selectors verified by WebFetch + at least one real
# (title, date) pair extracted. Plus a small static-events seed of major
# multi-month exhibitions discovered via eyeshenzhen.com that anchor
# the calendar until the live sources are unblocked.
#
# DEFERRED (GFW-blocked, re-probe from CN egress):
#   sso, polysztheatre, hxnart, ocat, szam, gsyart, hua-art, bc-sz,
#   bcube/B10 Live, timeoutshenzhen, visitshenzhen, seaworldculture,
#   shenzhenmuseum, shenzhenconcerthall, mocape, damai, maoyan,
#   showstart, taopiaopiao, yongle/piao.youku, shenzhen.gov.cn,
#   szdaily, eyeshenzhen full events catalog
# ============================================================================

# ============================================================================
# AGGREGATORS (the only working live source from this network)
# ============================================================================

- id: songkick-shenzhen
  name: Songkick Shenzhen (concerts aggregator)
  city: Futian                   # aggregator — per-event venue not yet parsed; default to city core
  category: concert
  homepage: https://www.songkick.com
  calendar_url: https://www.songkick.com/search?utf8=%E2%9C%93&type=upcoming&query=shenzhen
  kind: detail_pages
  source_priority: 1
  detail_url_pattern: '/concerts/\d+-[a-z0-9-]+'
  selectors:
    title: "h1"
    date: "body"
  date_extract_regex: '(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s+\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}'
  accept_drop_rate: 0.5
  notes: |
    Songkick search/?query=shenzhen is the ONLY non-GFW-blocked live
    concert source verified from this network. Recon 2026-05-21 confirmed
    5 real upcoming entries:
      - YUUF — Saturday 23 May 2026 — Hou Live
      - Cagoules et Décalcomanies — Friday 22 May 2026
      - STORM Festival 2026 (Marshmello) — Jun 13-14 2026
      - Piergiorgio Corallo — Friday 14 Aug 2026 — B10 Live
      - The Omnific — Sunday 27 Sep 2026 — Bo Live
    Detail URLs follow /concerts/<id>-<slug>. Festival URLs use a
    different /festivals/<id>/id/<id>-<slug> pattern not currently in
    detail_url_pattern — single-day concerts only this pass. Date in
    body prose, format "Saturday 23 May 2026". accept_drop_rate covers
    the festival-pattern URLs that won't match the concert filter.

    LIMITATION: aggregator is biased toward Western touring acts +
    livehouse circuit (Hou Live, B10, Bo Live). Misses Chinese
    domestic acts who only list on Damai/Maoyan (GFW-blocked above).


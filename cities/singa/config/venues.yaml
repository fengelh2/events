  source_priority: 1     # SISTIC is primary (50 SSO events); this catches misses
  selectors:
    item: "a.card__item"
    title: "h3"
    date: "p.fw-semibold"   # first p.fw-semibold inside .card__detail is the date; second is venue
    detail_link: "@href"
  # SSO date strings: "Sun / 24 May 26 / 4.00pm", "21 to 22 May 26 / 7.30pm",
  # "Sat / 30 May 26 / 7.30pm". 2-digit year; ranges use "to". The regex
  # below greedy-matches the LAST "DD Mon YY" token in the string, which for
  # ranges like "21 to 22 May 26" lands on "22 May 26" (the end date), and
  # for singles lands on "24 May 26". Acceptable — multi-day SSO concerts
  # are typically the same programme repeated.
  date_extract_regex: '\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{2,4}'
  extra_wait_ms: 5000
  scroll: true
  notes: |
    SSO website is Bootstrap, server-rendered shell with JS-hydrated card grid.
    a.card__item -> 13 cards on probe 2026-05-18; each card has <h3> title,
    .card__category small text, and two <p.fw-semibold> lines (date / venue).
    Probe validated 4 events (Hans Graf Farewell 21-22 May 26, Prodigious
    24 May 26, Jubilaum 30 May 26, Sound Making For Babies 31 May 26).


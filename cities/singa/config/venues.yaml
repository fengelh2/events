# Singapore cultural-events venues.
#
# Geographic zones: single zone "Singapore" (MRT-compact city-state).
# Date format: DD/MM/YYYY (British DMY). Time zone: Asia/Singapore (UTC+8, no DST).
#
# Probe pass 2026-05-18: each entry below validated against live HTML
# (selectors return N>0 cards + extract at least one title + date).
# `# FAIL:` comment lines record sources that failed probing.

# ============================================================================
# THEATRE
# ============================================================================

- id: wild-rice
  name: Wild Rice
  city: City Centre
  category: theatre
  homepage: https://www.wildrice.com.sg
  calendar_url: https://www.wildrice.com.sg/whats-on/
  kind: detail_pages
  source_priority: 0
  detail_url_pattern: 'https://www\.wildrice\.com\.sg/event/\d+-[a-z0-9-]+/'
  selectors:
    title: "h1"
    date: "body"
  # Range form "20 – 24 May 2026" (en-dash) or "11 – 27 Jun 2026"; single also possible.
  date_extract_regex: '\d{1,2}\s*[–-]\s*\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  notes: |
    Listing page is Elementor with dynamic per-row class IDs so html_list
    selectors are unstable. /event/<numeric-id>-<slug>/ URLs are stable;
    detail page h1 carries the title and the body has "DD – DD Mon YYYY".

- id: srt
  name: Singapore Repertory Theatre
  city: City Centre
  category: theatre
  homepage: https://www.srt.com.sg
  calendar_url: https://www.srt.com.sg/new
  kind: html_list
  source_priority: 0
  selectors:
    item: "a[href*='/show/']"
    title: "h4"
    date: "p"
    detail_link: "@href"
  # "Now till 31 May 2026", "From 18 Aug 2026", "19 - 21 Jun 2026", "22 Jul - 29 Aug 2026"
  date_extract_regex: '\d{1,2}\s*-\s*\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  notes: |
    /new page lists current SRT shows. Each is an <a href="/show/SLUG/">
    with .description > h4 (title) + p (date + venue separated by "|").

- id: pangdemonium
  name: Pangdemonium
  city: City Centre
  category: theatre
  homepage: https://pangdemonium.com
  calendar_url: https://pangdemonium.com/whats-on
  kind: html_list
  source_priority: 0
  selectors:
    item: "div.item.content-alignment-center-bottom-to-center"
    title: "h2.sppb-addon-title"
    date: "p.date"
    detail_link: "a.event-link@href"
  date_extract_regex: '\d{1,2}\s*[–-]\s*\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'
  notes: |
    SP Page Builder (Joomla). Item wrapper div.item; title h2.sppb-addon-title;
    date p.date inside .sppb-addon-subtitle.

- id: checkpoint-theatre
  name: Checkpoint Theatre
  city: City Centre
  category: theatre
  homepage: https://checkpoint-theatre.org
  calendar_url: https://checkpoint-theatre.org/
  kind: html_list
  source_priority: 0
  selectors:
    item: "li.event-single"
    title: "h3.post-title"
    date: "time.event-date"
    detail_link: "a@href"
  date_extract_regex: '\d{1,2}\s*[–-]\s*\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4}'

  # 20 events per JSON-LD block and paginates with `?page=N` up to 60+ pages
  # (1000+ total events). Single-URL parser only catches page 1 (20 events).
  notes: |
    Eventbrite's all-events listing embeds a perfect JSON-LD `ItemList`
    with 20 `Event` items per page. Our `json_ld_aggregator` parser
    handles it natively (each item has `name`, `startDate`, `url`).
    Limitation: single-URL only — to capture deeper pages add sibling
    entries (`eventbrite-sg-p2`, `-p3`, ...) with `?page=2/3/...` URLs,
    or extend json_ld_aggregator to walk `?page=N` until empty.


  # microdata (`<meta itemprop="startDate" content="2026-05-15T09:00 am+08:00">`).
  # The "am/pm" tail makes dateparser choke on the raw value — regex extracts
  # just the ISO date prefix.
  date_extract_regex: '\d{4}-\d{2}-\d{2}'
  notes: |
    Honeycombers' WordPress events plugin emits schema.org Event microdata
    on every `div.hc-event-card`. Title in h3 anchor, date in the
    `meta[itemprop="startDate"]` content attribute. Note the malformed
    timezone in the meta value ("am+08:00" / "pm+08:00") — strip via
    date_extract_regex matching just `YYYY-MM-DD`.
    Earlier note in venues.yaml said honeycombers calendar was retired —
    that was wrong; the calendar is alive and well-structured at this URL.


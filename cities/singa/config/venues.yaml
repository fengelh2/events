    `https://cms.sistic.com.sg/sistic/docroot/api/events` returns a clean
    JSON list with `title`, `start_date` ("Wed, 30 Nov 2022"),
    `event_date` (range), `alias` (URL slug), `venue_name`, `primary_genre`.
    Caps at limit=20 per page (422 if higher); paginate via `first=N`.
    `start_date` is often a past series-start date; `event_date` end is
    used to populate `Event.end` so future-window filters work.
    Re-validate if any of: API base URL changes, `data[]` shape changes,
    or `total_records` field disappears.


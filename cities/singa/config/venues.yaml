- id: sam
  name: Singapore Art Museum
  city: Singapore
  region: "City Centre"
  category: museum_exhibition
  homepage: https://www.singaporeartmuseum.sg
  calendar_url: https://www.singaporeartmuseum.sg/art-events
  kind: html_list
  source_priority: 0
  selectors:
    item: "a.exhibition"
    title: "span.exhibition__title"
    date: "span.exhibition__status"
    detail_link: "@href"
  # Status text e.g. "UNTIL 31 MAY '26", "FROM 1 JUL '26", or full range.
  date_extract_regex: "\\d{1,2}\\s+(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\\s+'?\\d{2,4}"
  date_format: "DD MON 'YY"
  notes: |
    Confirmed 7 a.exhibition cards on /art-events. Each card holds
    span.exhibition__title (title), span.exhibition__status ("UNTIL 31 MAY
    '26"), span.exhibition__info (location). The status uses uppercase
    short-month plus a 2-digit year. Render-side needs to expand '26→2026.

